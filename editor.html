```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thoughts — Editor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Caveat:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #eee9df;
      color: #302b27;
      font-family: "Amiri", serif;
      padding: 30px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
    }

    .login-screen {
      min-height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      width: min(420px, 100%);
      background: #fdfbf7;
      padding: 45px 35px;
      box-shadow: 0 8px 30px rgba(50, 40, 30, .12);
      text-align: center;
    }

    .login-logo {
      font-family: "Caveat", cursive;
      font-size: 42px;
      margin-bottom: 8px;
    }

    .login-subtitle {
      color: #9b8e82;
      margin-bottom: 30px;
      font-family: "Cairo", sans-serif;
      font-size: 13px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #d4cbc1;
      background: white;
      outline: none;
      font-family: "Cairo", sans-serif;
      direction: ltr;
      text-align: left;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: #302b27;
      color: white;
      margin-top: 5px;
    }

    .login-error {
      color: #a36f65;
      font-family: "Cairo", sans-serif;
      font-size: 13px;
      margin-top: 15px;
      min-height: 20px;
    }

    .app {
      display: none;
    }

    .topbar {
      width: min(1100px, 100%);
      margin: 0 auto 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-family: "Caveat", cursive;
      font-size: 30px;
    }

    .editor-label {
      font-size: 12px;
      color: #9b8e82;
      letter-spacing: 2px;
      direction: ltr;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .new-page,
    .preview-btn,
    .logout-btn {
      padding: 9px 17px;
      border-radius: 4px;
    }

    .new-page {
      background: #302b27;
      color: white;
    }

    .preview-btn,
    .logout-btn {
      background: transparent;
      color: #302b27;
      border: 1px solid #cfc6ba;
    }

    .toolbar,
    .appearance {
      width: min(900px, 100%);
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .toolbar {
      background: rgba(255, 255, 255, .65);
      border: 1px solid rgba(60, 50, 40, .08);
      padding: 9px;
      gap: 6px;
      border-radius: 5px 5px 0 0;
    }

    .tool {
      background: transparent;
      min-width: 34px;
      height: 32px;
      padding: 0 8px;
      border-radius: 3px;
    }

    .tool:hover {
      background: #e4ddd2;
    }

    .separator {
      width: 1px;
      height: 23px;
      background: #d3cbc1;
    }

    select {
      height: 32px;
      border: none;
      background: transparent;
      font-family: inherit;
      cursor: pointer;
      color: #302b27;
    }

    .appearance {
      background: rgba(255, 255, 255, .48);
      border: 1px solid rgba(60, 50, 40, .08);
      border-top: none;
      padding: 10px 14px;
      gap: 15px;
      font-size: 13px;
      color: #756b62;
    }

    .appearance-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .style-select {
      background: rgba(255, 255, 255, .7);
      border: 1px solid #d5ccc1;
      border-radius: 4px;
      padding: 3px 8px;
    }

    .color-picker {
      width: 32px;
      height: 27px;
      border: 1px solid #cfc6ba;
      border-radius: 4px;
      padding: 2px;
      cursor: pointer;
    }

    .reset-style {
      background: transparent;
      color: #9b8e82;
      text-decoration: underline;
    }

    .meta-bar {
      width: min(900px, 100%);
      margin: 15px auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status-select {
      border: 1px solid #d4cbc1;
      background: rgba(255, 255, 255, .65);
      border-radius: 4px;
      padding: 8px 12px;
    }

    .tags-input {
      flex: 1;
      min-width: 180px;
      border: 1px solid #d4cbc1;
      background: rgba(255, 255, 255, .65);
      padding: 9px 12px;
      border-radius: 4px;
      outline: none;
      font-family: inherit;
    }

    .paper-wrapper {
      width: min(900px, 100%);
      margin: auto;
    }

    .paper {
      min-height: 950px;
      background: #fdfbf7;
      color: #302b27;
      padding: 75px 90px 90px;
      box-shadow:
        0 8px 30px rgba(50, 40, 30, .12),
        0 1px 3px rgba(0, 0, 0, .05);
      position: relative;
    }

    .date {
      text-align: center;
      direction: ltr;
      color: #a09184;
      font-family: "Caveat", cursive;
      font-size: 19px;
      min-height: 30px;
      outline: none;
      margin-bottom: 35px;
    }

    .date:empty::before {
      content: "date";
      opacity: .45;
    }

    .title {
      text-align: center;
      font-size: 36px;
      font-weight: 700;
      line-height: 1.5;
      min-height: 55px;
      outline: none;
      margin-bottom: 45px;
    }

    .title:empty::before {
      content: "عنوان الكتابة";
      color: #c5bdb4;
    }

    .content {
      min-height: 600px;
      outline: none;
      font-size: 22px;
      line-height: 2.2;
    }

    .content:empty::before {
      content: "اكتبي هنا...";
      color: #c5bdb4;
    }

    .content img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 30px auto;
    }

    .page-number {
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      font-family: "Caveat", cursive;
      color: #aaa097;
      font-size: 17px;
    }

    .actions {
      width: min(900px, 100%);
      margin: 18px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .save {
      background: #302b27;
      color: white;
      padding: 11px 25px;
      border-radius: 4px;
    }

    .delete {
      background: transparent;
      color: #a36f65;
    }

    .saved-message {
      color: #8d8176;
      opacity: 0;
      transition: .3s;
    }

    .saved-message.show {
      opacity: 1;
    }

    .pages {
      width: min(900px, 100%);
      margin: 45px auto;
    }

    .pages-title {
      font-family: "Caveat", cursive;
      font-size: 25px;
      margin-bottom: 15px;
      direction: ltr;
    }

    .page-search {
      width: 100%;
      margin-bottom: 15px;
      border: 1px solid #d4cbc1;
      background: rgba(255, 255, 255, .5);
      padding: 10px 12px;
      outline: none;
      font-family: inherit;
    }

    .page-item {
      background: rgba(255, 255, 255, .5);
      border: 1px solid rgba(60, 50, 40, .07);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 7px;
      cursor: pointer;
    }

    .page-info {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .page-index {
      font-family: "Caveat", cursive;
      color: #a49486;
    }

    .page-date {
      color: #9c9187;
      font-size: 13px;
    }

    .page-status {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 10px;
    }

    .page-status.published {
      background: #dfe9df;
      color: #536653;
    }

    .page-status.draft {
      background: #eee4d5;
      color: #806f58;
    }

    .empty-pages {
      color: #a79c92;
    }

    .backup {
      width: min(900px, 100%);
      margin: 35px auto;
      padding-top: 20px;
      border-top: 1px solid rgba(100, 90, 80, .15);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .backup button {
      background: transparent;
      border: 1px solid #d0c6bb;
      padding: 8px 13px;
      border-radius: 4px;
      color: #756b62;
    }

    body.preview-mode {
      padding: 0;
    }

    body.preview-mode .topbar,
    body.preview-mode .toolbar,
    body.preview-mode .appearance,
    body.preview-mode .meta-bar,
    body.preview-mode .actions,
    body.preview-mode .pages,
    body.preview-mode .backup {
      display: none;
    }

    body.preview-mode .paper {
      min-height: 100vh;
      box-shadow: none;
    }

    .exit-preview {
      display: none;
    }

    body.preview-mode .exit-preview {
      display: block;
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: #302b27;
      color: white;
      padding: 9px 15px;
      border-radius: 4px;
    }

    @media (max-width: 700px) {
      body {
        padding: 15px;
      }

      .paper {
        padding: 55px 25px 80px;
        min-height: 750px;
      }

      .title {
        font-size: 28px;
      }

      .content {
        font-size: 19px;
        line-height: 2.05;
      }

      .topbar {
        flex-wrap: wrap;
      }

      .appearance {
        justify-content: flex-start;
      }

      .page-item {
        align-items: flex-start;
        flex-direction: column;
      }

      .page-info {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div id="loginScreen" class="login-screen">

    <div class="login-box">

      <div class="login-logo">
        Thoughts
      </div>

      <div class="login-subtitle">
        Private Editor
      </div>

      <input
        id="loginEmail"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        class="login-btn"
        onclick="login()"
      >
        Enter Editor
      </button>

      <div
        id="loginError"
        class="login-error"
      ></div>

    </div>

  </div>


  <!-- APP -->

  <div id="app" class="app">

    <header class="topbar">

      <div>
        <div class="logo">
          Thoughts
        </div>

        <div class="editor-label">
          EDITOR
        </div>
      </div>

      <div class="top-actions">

        <button
          class="preview-btn"
          onclick="togglePreview()"
        >
          Preview
        </button>

        <button
          class="new-page"
          onclick="newPage()"
        >
          + New Page
        </button>

        <button
          class="logout-btn"
          onclick="logout()"
        >
          Logout
        </button>

      </div>

    </header>


    <div class="toolbar">

      <button class="tool" onclick="format('bold')">
        <b>B</b>
      </button>

      <button class="tool" onclick="format('italic')">
        <i>I</i>
      </button>

      <button class="tool" onclick="format('underline')">
        <u>U</u>
      </button>

      <span class="separator"></span>

      <select onchange="changeFontSize(this.value)">
        <option value="3">حجم عادي</option>
        <option value="4">كبير</option>
        <option value="5">أكبر</option>
        <option value="6">كبير جدًا</option>
      </select>

      <span class="separator"></span>

      <button class="tool" onclick="format('justifyRight')">☰</button>
      <button class="tool" onclick="format('justifyCenter')">≡</button>
      <button class="tool" onclick="format('justifyLeft')">☰</button>

      <span class="separator"></span>

      <button class="tool" onclick="insertImage()">🖼</button>

    </div>


    <div class="appearance">

      <div class="appearance-group">
        <label>الخط</label>

        <select
          id="fontFamily"
          class="style-select"
          onchange="changeFontFamily(this.value)"
        >
          <option value="Amiri">Amiri</option>
          <option value="Cairo">Cairo</option>
          <option value="Tajawal">Tajawal</option>
          <option value="Noto Naskh Arabic">Noto Naskh Arabic</option>
          <option value="Caveat">Caveat</option>
          <option value="Georgia">Georgia</option>
        </select>
      </div>

      <div class="appearance-group">
        <label>لون الكتابة</label>

        <input
          id="textColor"
          class="color-picker"
          type="color"
          value="#302b27"
          onchange="changeTextColor(this.value)"
        >
      </div>

      <div class="appearance-group">
        <label>لون الورقة</label>

        <input
          id="paperColor"
          class="color-picker"
          type="color"
          value="#fdfbf7"
          onchange="changePaperColor(this.value)"
        >
      </div>

      <div class="appearance-group">
        <label>شكل الصفحة</label>

        <select
          id="pageStyle"
          class="style-select"
          onchange="changePageStyle(this.value)"
        >
          <option value="soft">Soft</option>
          <option value="clean">Clean</option>
          <option value="shadow">Shadow</option>
          <option value="dark">Dark</option>
        </select>
      </div>

      <button
        class="reset-style"
        onclick="resetStyle()"
      >
        Reset
      </button>

    </div>


    <div class="meta-bar">

      <select
        id="status"
        class="status-select"
      >
        <option value="draft">Draft</option>
        <option value="published">Published</option>
      </select>

      <input
        id="tags"
        class="tags-input"
        type="text"
        placeholder="Tags — مثال: thoughts, life, overthinking"
      >

    </div>


    <main class="paper-wrapper">

      <section
        class="paper"
        id="paper"
      >

        <div
          id="date"
          class="date"
          contenteditable="true"
          spellcheck="false"
        ></div>

        <h1
          id="title"
          class="title"
          contenteditable="true"
        ></h1>

        <div
          id="content"
          class="content"
          contenteditable="true"
        ></div>

        <div
          id="pageNumber"
          class="page-number"
        >
          01
        </div>

      </section>

    </main>


    <button
      class="exit-preview"
      onclick="togglePreview()"
    >
      Exit Preview
    </button>


    <div class="actions">

      <button
        class="delete"
        onclick="deleteCurrentPage()"
      >
        Delete page
      </button>

      <span
        id="savedMessage"
        class="saved-message"
      >
        Saved ✓
      </span>

      <button
        class="save"
        onclick="savePage()"
      >
        Save
      </button>

    </div>


    <section class="pages">

      <h2 class="pages-title">
        Your pages
      </h2>

      <input
        id="pageSearch"
        class="page-search"
        type="search"
        placeholder="Search your pages..."
        oninput="displayPages(this.value)"
      >

      <div id="pagesList"></div>

    </section>


    <section class="backup">

      <button onclick="exportBackup()">
        Export Backup
      </button>

      <button onclick="document.getElementById('restoreInput').click()">
        Restore Backup
      </button>

      <input
        id="restoreInput"
        type="file"
        accept=".json"
        style="display:none"
        onchange="restoreBackup(event)"
      >

    </section>

  </div>


  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://fytuxwmmbguombjidbvb.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_mw6HCU-bobHuYZZ5AMd9HQ_cOzXLeXY";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================
       DATA
    ========================= */

    let pages = [];
    let currentPageId = null;
    let currentUser = null;


    const defaultStyle = {
      paperColor: "#fdfbf7",
      textColor: "#302b27",
      fontFamily: "Amiri",
      pageStyle: "soft"
    };


    const date =
      document.getElementById("date");

    const title =
      document.getElementById("title");

    const content =
      document.getElementById("content");

    const paper =
      document.getElementById("paper");

    const status =
      document.getElementById("status");

    const tags =
      document.getElementById("tags");


    /* =========================
       AUTH
    ========================= */

    async function checkAuth() {

      const {
        data: {
          session
        }
      } =
        await supabaseClient.auth.getSession();

      if (session) {

        currentUser =
          session.user;

        showEditor();

      }

      else {

        showLogin();

      }

    }


    function showLogin() {

      document.getElementById(
        "loginScreen"
      ).style.display = "flex";

      document.getElementById(
        "app"
      ).style.display = "none";

    }


    async function showEditor() {

      document.getElementById(
        "loginScreen"
      ).style.display = "none";

      document.getElementById(
        "app"
      ).style.display = "block";

      await loadPages();

    }


    async function login() {

      const email =
        document.getElementById(
          "loginEmail"
        ).value.trim();

      const password =
        document.getElementById(
          "loginPassword"
        ).value;

      const errorBox =
        document.getElementById(
          "loginError"
        );

      errorBox.textContent = "";

      if (!email || !password) {

        errorBox.textContent =
          "اكتبي الإيميل والباسورد.";

        return;

      }


      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });


      if (error) {

        errorBox.textContent =
          "الإيميل أو الباسورد غير صحيح.";

        console.error(error);

        return;

      }


      currentUser =
        data.user;

      await showEditor();

    }


    async function logout() {

      await supabaseClient.auth.signOut();

      currentUser = null;
      pages = [];
      currentPageId = null;

      showLogin();

    }


    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        if (event === "SIGNED_OUT") {

          currentUser = null;

          showLogin();

        }

      }
    );


    /* =========================
       LOAD PAGES
    ========================= */

    async function loadPages() {

      if (!currentUser) return;

      const {
        data,
        error
      } =
        await supabaseClient
          .from("thoughts")
          .select("*")
          .eq(
            "owner_id",
            currentUser.id
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(error);

        alert(
          "حصلت مشكلة في تحميل الكتابات."
        );

        return;

      }


      pages =
        (data || []).map(page => ({

          id: page.id,

          date:
            page.date || "",

          title:
            page.title || "",

          content:
            page.content || "",

          status:
            page.status || "draft",

          tags:
            page.tags || [],

          style:
            page.style || defaultStyle,

          createdAt:
            page.created_at,

          updatedAt:
            page.updated_at

        }));


      displayPages();

      newPage();

    }


    /* =========================
       FORMAT
    ========================= */

    function format(command) {

      content.focus();

      document.execCommand(
        command,
        false,
        null
      );

    }


    function changeFontSize(size) {

      content.focus();

      document.execCommand(
        "fontSize",
        false,
        size
      );

    }


    /* =========================
       IMAGE
    ========================= */

    function insertImage() {

      const input =
        document.createElement("input");

      input.type = "file";
      input.accept = "image/*";

      input.onchange = event => {

        const file =
          event.target.files[0];

        if (!file) return;

        const reader =
          new FileReader();

        reader.onload = e => {

          content.focus();

          document.execCommand(
            "insertImage",
            false,
            e.target.result
          );

          autoSave();

        };

        reader.readAsDataURL(file);

      };

      input.click();

    }


    /* =========================
       STYLE
    ========================= */

    function changeFontFamily(font) {

      const family =
        `"${font}", serif`;

      content.style.fontFamily =
        family;

      title.style.fontFamily =
        family;

      date.style.fontFamily =
        family;

    }


    function changeTextColor(color) {

      paper.style.color = color;
      content.style.color = color;
      title.style.color = color;

    }


    function changePaperColor(color) {

      paper.style.backgroundColor =
        color;

    }


    function changePageStyle(style) {

      paper.dataset.style =
        style;

      if (style === "soft") {

        paper.style.boxShadow =
          "0 8px 30px rgba(50,40,30,.12), 0 1px 3px rgba(0,0,0,.05)";

      }

      if (style === "clean") {

        paper.style.boxShadow =
          "none";

      }

      if (style === "shadow") {

        paper.style.boxShadow =
          "0 18px 45px rgba(40,30,20,.20)";

      }

      if (style === "dark") {

        paper.style.backgroundColor =
          "#292522";

        paper.style.color =
          "#f4eee5";

        content.style.color =
          "#f4eee5";

        title.style.color =
          "#f4eee5";

      }

    }


    function resetStyle() {

      paper.style.backgroundColor =
        defaultStyle.paperColor;

      paper.style.color =
        defaultStyle.textColor;

      content.style.color =
        defaultStyle.textColor;

      title.style.color =
        defaultStyle.textColor;

      paper.style.boxShadow =
        "0 8px 30px rgba(50,40,30,.12), 0 1px 3px rgba(0,0,0,.05)";

      paper.dataset.style =
        "soft";

      content.style.fontFamily =
        '"Amiri", serif';

      title.style.fontFamily =
        '"Amiri", serif';

      date.style.fontFamily =
        '"Caveat", cursive';

      document.getElementById(
        "fontFamily"
      ).value = "Amiri";

      document.getElementById(
        "textColor"
      ).value = "#302b27";

      document.getElementById(
        "paperColor"
      ).value = "#fdfbf7";

      document.getElementById(
        "pageStyle"
      ).value = "soft";

    }


    function getCurrentStyle() {

      return {

        paperColor:
          document.getElementById(
            "paperColor"
          ).value,

        textColor:
          document.getElementById(
            "textColor"
          ).value,

        fontFamily:
          document.getElementById(
            "fontFamily"
          ).value,

        pageStyle:
          document.getElementById(
            "pageStyle"
          ).value

      };

    }


    function applyStyle(style) {

      style =
        Object.assign(
          {},
          defaultStyle,
          style || {}
        );


      paper.style.backgroundColor =
        style.paperColor;

      paper.style.color =
        style.textColor;

      content.style.color =
        style.textColor;

      title.style.color =
        style.textColor;

      paper.dataset.style =
        style.pageStyle;


      content.style.fontFamily =
        `"${style.fontFamily}", serif`;

      title.style.fontFamily =
        `"${style.fontFamily}", serif`;

      date.style.fontFamily =
        `"${style.fontFamily}", serif`;


      document.getElementById(
        "fontFamily"
      ).value =
        style.fontFamily;

      document.getElementById(
        "textColor"
      ).value =
        style.textColor;

      document.getElementById(
        "paperColor"
      ).value =
        style.paperColor;

      document.getElementById(
        "pageStyle"
      ).value =
        style.pageStyle;


      if (style.pageStyle === "clean") {

        paper.style.boxShadow =
          "none";

      }

      else if (style.pageStyle === "shadow") {

        paper.style.boxShadow =
          "0 18px 45px rgba(40,30,20,.20)";

      }

      else if (style.pageStyle === "dark") {

        paper.style.backgroundColor =
          "#292522";

        paper.style.color =
          "#f4eee5";

        content.style.color =
          "#f4eee5";

        title.style.color =
          "#f4eee5";

        paper.style.boxShadow =
          "0 18px 45px rgba(0,0,0,.25)";

      }

      else {

        paper.style.boxShadow =
          "0 8px 30px rgba(50,40,30,.12), 0 1px 3px rgba(0,0,0,.05)";

      }

    }


    /* =========================
       NEW PAGE
    ========================= */

    function newPage() {

      currentPageId = null;

      date.innerHTML = "";
      title.innerHTML = "";
      content.innerHTML = "";

      status.value = "draft";
      tags.value = "";

      document.getElementById(
        "pageNumber"
      ).textContent =
        String(
          pages.length + 1
        ).padStart(2, "0");

      resetStyle();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =========================
       SAVE
    ========================= */

    async function savePage() {

      if (!currentUser) {

        alert("لازم تسجلي الدخول الأول.");

        return;

      }


      const dateValue =
        date.innerHTML.trim();

      const titleValue =
        title.innerHTML.trim();

      const contentValue =
        content.innerHTML.trim();


      if (!titleValue && !contentValue) {

        alert("اكتبي حاجة الأول ❤️");

        return;

      }


      const tagList =
        tags.value
          .split(",")
          .map(tag => tag.trim())
          .filter(Boolean);


      const pageData = {

        date: dateValue,

        title: titleValue,

        content: contentValue,

        status: status.value,

        tags: tagList,

        style: getCurrentStyle(),

        updated_at:
          new Date().toISOString()

      };


      if (currentPageId === null) {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("thoughts")
            .insert({

              owner_id:
                currentUser.id,

              date:
                pageData.date,

              title:
                pageData.title,

              content:
                pageData.content,

              status:
                pageData.status,

              tags:
                pageData.tags,

              style:
                pageData.style

            })
            .select()
            .single();


        if (error) {

          console.error(error);

          alert(
            "حصلت مشكلة أثناء الحفظ."
          );

          return;

        }


        currentPageId =
          data.id;


        pages.push({

          id: data.id,

          date: data.date,

          title: data.title,

          content: data.content,

          status: data.status,

          tags: data.tags || [],

          style: data.style || defaultStyle,

          createdAt: data.created_at,

          updatedAt: data.updated_at

        });

      }


      else {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("thoughts")
            .update(pageData)
            .eq(
              "id",
              currentPageId
            )
            .eq(
              "owner_id",
              currentUser.id
            )
            .select()
            .single();


        if (error) {

          console.error(error);

          alert(
            "حصلت مشكلة أثناء تحديث الصفحة."
          );

          return;

        }


        const index =
          pages.findIndex(
            p =>
              p.id === currentPageId
          );


        if (index !== -1) {

          pages[index] = {

            id: data.id,

            date: data.date,

            title: data.title,

            content: data.content,

            status: data.status,

            tags: data.tags || [],

            style:
              data.style || defaultStyle,

            createdAt:
              data.created_at,

            updatedAt:
              data.updated_at

          };

        }

      }


      updatePageNumber();

      showSavedMessage();

      displayPages();

    }


    /* =========================
       LOAD PAGE
    ========================= */

    function loadPage(id) {

      const page =
        pages.find(
          p => p.id === id
        );

      if (!page) return;

      currentPageId =
        page.id;

      date.innerHTML =
        page.date || "";

      title.innerHTML =
        page.title || "";

      content.innerHTML =
        page.content || "";

      status.value =
        page.status || "draft";

      tags.value =
        (page.tags || []).join(", ");

      applyStyle(
        page.style || defaultStyle
      );

      updatePageNumber();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    function updatePageNumber() {

      const index =
        pages.findIndex(
          page =>
            page.id ===
            currentPageId
        );

      document.getElementById(
        "pageNumber"
      ).textContent =
        String(
          index >= 0
            ? index + 1
            : pages.length + 1
        ).padStart(2, "0");

    }


    /* =========================
       DELETE
    ========================= */

    async function deleteCurrentPage() {

      if (currentPageId === null) {

        alert(
          "مفيش صفحة محفوظة للحذف."
        );

        return;

      }


      const confirmed =
        confirm(
          "متأكدة إنك عايزة تمسحي الصفحة دي؟"
        );

      if (!confirmed) return;


      const {
        error
      } =
        await supabaseClient
          .from("thoughts")
          .delete()
          .eq(
            "id",
            currentPageId
          )
          .eq(
            "owner_id",
            currentUser.id
          );


      if (error) {

        console.error(error);

        alert(
          "حصلت مشكلة أثناء الحذف."
        );

        return;

      }


      pages =
        pages.filter(
          p =>
            p.id !== currentPageId
        );


      newPage();

      displayPages();

    }


    /* =========================
       DISPLAY PAGES
    ========================= */

    function displayPages(query = "") {

      const list =
        document.getElementById(
          "pagesList"
        );

      list.innerHTML = "";


      const search =
        query
          .trim()
          .toLowerCase();


      const filtered =
        pages.filter(page => {

          const text = [

            page.title || "",

            page.date || "",

            page.content || "",

            ...(page.tags || [])

          ]
            .join(" ")
            .toLowerCase();


          return text.includes(search);

        });


      if (!filtered.length) {

        list.innerHTML =
          `
            <div class="empty-pages">
              لسه مفيش صفحات محفوظة.
            </div>
          `;

        return;

      }


      filtered.forEach(page => {

        const originalIndex =
          pages.indexOf(page);


        const item =
          document.createElement(
            "div"
          );

        item.className =
          "page-item";


        item.onclick =
          () =>
            loadPage(page.id);


        const statusClass =
          page.status === "published"
            ? "published"
            : "draft";


        const statusText =
          page.status === "published"
            ? "Published"
            : "Draft";


        item.innerHTML =
          `
            <div class="page-info">

              <span class="page-index">
                ${String(
                  originalIndex + 1
                ).padStart(2, "0")}
              </span>

              <strong>
                ${escapeHTML(
                  page.title ||
                  "بدون عنوان"
                )}
              </strong>

              <span class="page-status ${statusClass}">
                ${statusText}
              </span>

            </div>

            <span class="page-date">
              ${escapeHTML(
                page.date || ""
              )}
            </span>
          `;


        list.appendChild(item);

      });

    }


    function escapeHTML(value) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        value || "";

      return div.innerHTML;

    }


    function showSavedMessage() {

      const message =
        document.getElementById(
          "savedMessage"
        );

      message.classList.add("show");

      setTimeout(
        () =>
          message.classList.remove("show"),
        1800
      );

    }


    /* =========================
       AUTO SAVE
    ========================= */

    let autoSaveTimer;


    function autoSave() {

      clearTimeout(autoSaveTimer);

      autoSaveTimer =
        setTimeout(
          () => {

            if (
              currentPageId !== null &&
              (
                title.innerHTML.trim() ||
                content.innerHTML.trim()
              )
            ) {

              savePage();

            }

          },
          1500
        );

    }


    [
      date,
      title,
      content,
      tags
    ].forEach(element => {

      element.addEventListener(
        "input",
        autoSave
      );

    });


    /* =========================
       PREVIEW
    ========================= */

    function togglePreview() {

      document.body.classList.toggle(
        "preview-mode"
      );

    }


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          document.body.classList.contains(
            "preview-mode"
          )
        ) {

          togglePreview();

        }

      }
    );


    /* =========================
       BACKUP
    ========================= */

    function exportBackup() {

      const data =
        JSON.stringify(
          pages,
          null,
          2
        );

      const blob =
        new Blob(
          [data],
          {
            type:
              "application/json"
          }
        );

      const url =
        URL.createObjectURL(blob);

      const a =
        document.createElement("a");

      a.href = url;

      a.download =
        "thoughts-backup.json";

      a.click();

      URL.revokeObjectURL(url);

    }


    function restoreBackup(event) {

      const file =
        event.target.files[0];

      if (!file) return;

      const reader =
        new FileReader();

      reader.onload =
        async e => {

          try {

            const imported =
              JSON.parse(
                e.target.result
              );


            if (
              !Array.isArray(imported)
            ) {

              throw new Error();

            }


            const confirmed =
              confirm(
                "استرجاع النسخة الاحتياطية هيضيف الصفحات إلى حسابك. متأكدة؟"
              );

            if (!confirmed) return;


            for (
              const page of imported
            ) {

              await supabaseClient
                .from("thoughts")
                .insert({

                  owner_id:
                    currentUser.id,

                  date:
                    page.date || "",

                  title:
                    page.title || "",

                  content:
                    page.content || "",

                  status:
                    page.status || "draft",

                  tags:
                    page.tags || [],

                  style:
                    page.style || defaultStyle

                });

            }


            await loadPages();

            alert(
              "تم استرجاع النسخة بنجاح ❤️"
            );

          }

          catch {

            alert(
              "ملف النسخة الاحتياطية غير صالح."
            );

          }

        };


      reader.readAsText(file);

      event.target.value = "";

    }


    /* =========================
       START
    ========================= */

    checkAuth();

  </script>

</body>
